# =============================================================================
# config/postgres/99-iact.conf — Overrides de PostgreSQL para el proyecto IACT
# =============================================================================
# Se vincula con symlink a /etc/postgresql/16/main/conf.d/99-iact.conf
# durante el provisionamiento (provisioners/postgres/setup.sh).
# postgresql.conf ya tiene: include_dir = 'conf.d'
#
# Por qué 99-iact.conf:
#   conf.d/ lee archivos *.conf en orden alfabético.
#   El prefijo 99 garantiza máxima precedencia sobre los defaults del sistema.
#
# Para activar en un servidor:
#   sudo bash provisioners/postgres/setup.sh   (lo hace automáticamente)
#   O manualmente:
#   PG_CONF_D=/etc/postgresql/16/main/conf.d
#   sudo ln -sf "$(pwd)/config/postgres/99-iact.conf" \
#               "${PG_CONF_D}/99-iact.conf"
#   sudo systemctl reload postgresql
# =============================================================================

# Codificación y locale — alinear con iact_analytics y Django
# (el encoding real se establece en CREATE DATABASE; esto solo afecta
# nuevas bases creadas sin especificar encoding explícito)
# client_encoding = 'UTF8'

# Logging mínimo para desarrollo — en producción ajustar según política
log_min_duration_statement = 1000   # loguear queries > 1s
log_line_prefix = '%t [%p]: [%l-1] '
